<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragmento da Sidebar Reutilizável com Responsividade Mobile e Desktop -->
<th:block th:fragment="sidebar(activePage)">

    <!-- Topbar Mobile (Visível apenas em telas < 992px) -->
    <header class="mobile-topbar d-lg-none">
        <button type="button" class="btn-hamburger" id="mobileMenuBtn" aria-label="Abrir Menu">
            <i class="bi bi-list"></i>
        </button>
        <div class="mobile-brand">
            <div class="brand-icon-circle-sm">
                <i class="bi bi-book-half"></i>
            </div>
            <span class="fw-bold fs-6 text-dark">Biblioteca</span>
        </div>
        <a th:href="@{/emprestimos/novo}" class="btn-mobile-action" title="Novo Empréstimo">
            <i class="bi bi-plus-lg"></i>
        </a>
    </header>

    <!-- Backdrop Escuro para fechar menu no mobile ao clicar fora -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="appSidebar">
        <!-- Header: Logo/Brand (Clique para Expandir/Recolher no Desktop ou Fechar no Mobile) -->
        <div class="sidebar-header">
            <a href="javascript:void(0)" class="sidebar-brand" id="sidebarBrandToggle" title="Clique para expandir/recolher menu">
                <div class="brand-icon-circle">
                    <i class="bi bi-book-half"></i>
                </div>
                <h1 class="brand-title">Biblioteca</h1>
            </a>
            <button type="button" class="btn-close-mobile d-lg-none" id="mobileCloseBtn" aria-label="Fechar Menu">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- Botão de Ação Rápida -->
        <div class="sidebar-action-wrapper">
            <a th:href="@{/emprestimos/novo}" class="btn-action-pill" data-bs-toggle="tooltip" data-bs-placement="right" title="Novo Empréstimo">
                <i class="bi bi-plus-lg"></i>
                <span class="action-text">Novo Empréstimo</span>
            </a>
        </div>

        <!-- Lista de Navegação -->
        <ul class="sidebar-nav">
            <li>
                <a th:href="@{/}" class="sidebar-link" th:classappend="${activePage == 'painel' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Painel">
                    <i class="bi bi-grid-fill"></i>
                    <span class="link-text">Painel</span>
                </a>
            </li>
            <li>
                <a th:href="@{/livros}" class="sidebar-link" th:classappend="${activePage == 'livros' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Livros">
                    <i class="bi bi-book"></i>
                    <span class="link-text">Livros</span>
                </a>
            </li>
            <li>
                <a th:href="@{/autores}" class="sidebar-link" th:classappend="${activePage == 'autores' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Autores">
                    <i class="bi bi-person"></i>
                    <span class="link-text">Autores</span>
                </a>
            </li>
            <li>
                <a th:href="@{/editoras}" class="sidebar-link" th:classappend="${activePage == 'editoras' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Editoras">
                    <i class="bi bi-buildings"></i>
                    <span class="link-text">Editoras</span>
                </a>
            </li>
            <li>
                <a th:href="@{/alunos}" class="sidebar-link" th:classappend="${activePage == 'alunos' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Alunos">
                    <i class="bi bi-mortarboard"></i>
                    <span class="link-text">Alunos</span>
                </a>
            </li>
            <li>
                <a th:href="@{/emprestimos}" class="sidebar-link" th:classappend="${activePage == 'emprestimos' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Empréstimos">
                    <i class="bi bi-calendar-event"></i>
                    <span class="link-text">Empréstimos</span>
                </a>
            </li>
            <li>
                <a th:href="@{/multas}" class="sidebar-link" th:classappend="${activePage == 'multas' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Multas">
                    <i class="bi bi-wallet2"></i>
                    <span class="link-text">Multas</span>
                </a>
            </li>
            <li>
                <a th:href="@{/relatorios}" class="sidebar-link" th:classappend="${activePage == 'relatorios' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Relatórios">
                    <i class="bi bi-file-earmark-text"></i>
                    <span class="link-text">Relatórios</span>
                </a>
            </li>
            <li>
                <a th:href="@{/configuracoes}" class="sidebar-link" th:classappend="${activePage == 'configuracoes' ? 'active' : ''}" data-bs-toggle="tooltip" data-bs-placement="right" title="Configurações">
                    <i class="bi bi-gear-fill"></i>
                    <span class="link-text">Configurações</span>
                </a>
            </li>
        </ul>

        <!-- Container Global de Toasts Flutuantes -->
        <div id="globalToastContainer"></div>

        <!-- Modal Customizado de Confirmação Global (Substitui confirm() nativo do navegador) -->
        <div class="modal fade" id="globalConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm" style="max-width: 380px;">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 18px; overflow: hidden; background: #ffffff;">
                    <div class="modal-body p-4 text-center">
                        <div id="confirmModalIconWrapper" class="mx-auto mb-3 d-flex align-items-center justify-content-center"
                             style="width: 52px; height: 52px; border-radius: 50%; background: #fee2e2; color: #dc2626; font-size: 1.5rem; transition: all 0.2s ease;">
                            <i id="confirmModalIcon" class="bi bi-trash3"></i>
                        </div>
                        <h6 class="fw-bold mb-2 text-dark" id="confirmModalTitle" style="font-size: 1.05rem;">Confirmar Ação</h6>
                        <p class="text-secondary small mb-4 px-2" id="confirmModalMessage" style="line-height: 1.45;">Tem certeza de que deseja realizar esta ação?</p>
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="button" class="btn btn-light rounded-pill px-3 py-2 fw-semibold flex-fill text-muted" data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="button" id="confirmModalBtnConfirm" class="btn btn-danger rounded-pill px-3 py-2 fw-semibold flex-fill shadow-sm">
                                Confirmar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Script de Controle: Sidebar + Sistema Customizado de Alertas, Toasts e Confirmações -->
    <script>
        (function() {
            const sidebar = document.getElementById('appSidebar');
            const brandToggle = document.getElementById('sidebarBrandToggle');
            const confirmModalEl = document.getElementById('globalConfirmModal');

            // Move o modal e container de toasts para document.body para evitar qualquer conflito de stacking context (z-index)
            if (confirmModalEl && confirmModalEl.parentElement !== document.body) {
                document.body.appendChild(confirmModalEl);
            }
            const toastContainer = document.getElementById('globalToastContainer');
            if (toastContainer && toastContainer.parentElement !== document.body) {
                document.body.appendChild(toastContainer);
            }

            // Aplica estado salvo no localStorage
            const savedState = localStorage.getItem('sidebar_collapsed');
            if (savedState === 'true') {
                sidebar.classList.add('collapsed');
            }

            function setupTooltips(isCollapsed) {
                if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
                    const tooltipElements = sidebar.querySelectorAll('[data-bs-toggle="tooltip"]');
                    tooltipElements.forEach(el => {
                        let instance = bootstrap.Tooltip.getInstance(el);
                        if (isCollapsed) {
                            if (!instance) {
                                instance = new bootstrap.Tooltip(el, { boundary: 'window', delay: { show: 150, hide: 50 } });
                            }
                            instance.enable();
                        } else {
                            if (instance) {
                                instance.hide();
                                instance.disable();
                            }
                        }
                    });
                }
            }

            // Controle de Responsividade Mobile
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileCloseBtn = document.getElementById('mobileCloseBtn');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');

            function openMobileSidebar() {
                if (sidebar) sidebar.classList.add('show-mobile');
                if (sidebarBackdrop) sidebarBackdrop.classList.add('show');
                document.body.classList.add('mobile-nav-open');
            }

            function closeMobileSidebar() {
                if (sidebar) sidebar.classList.remove('show-mobile');
                if (sidebarBackdrop) sidebarBackdrop.classList.remove('show');
                document.body.classList.remove('mobile-nav-open');
            }

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    openMobileSidebar();
                });
            }

            if (mobileCloseBtn) {
                mobileCloseBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    closeMobileSidebar();
                });
            }

            if (sidebarBackdrop) {
                sidebarBackdrop.addEventListener('click', function() {
                    closeMobileSidebar();
                });
            }

            // 1. Ao clicar no logotipo, alterna a expansão no Desktop
            if (brandToggle) {
                brandToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (window.innerWidth >= 992) {
                        sidebar.classList.toggle('collapsed');
                        const isCollapsed = sidebar.classList.contains('collapsed');
                        localStorage.setItem('sidebar_collapsed', isCollapsed);
                        setupTooltips(isCollapsed);
                    }
                });
            }

            // 2. Ao clicar fora da sidebar no Desktop, recolhe
            document.addEventListener('click', function(e) {
                if (window.innerWidth >= 992) {
                    if (sidebar && !sidebar.contains(e.target)) {
                        if (!sidebar.classList.contains('collapsed')) {
                            sidebar.classList.add('collapsed');
                            localStorage.setItem('sidebar_collapsed', 'true');
                            setupTooltips(true);
                        }
                    }
                }
            });

            // 3. Sistema Global de Toasts Customizáveis
            window.showToast = function(type, message, duration = 4500) {
                const container = document.getElementById('globalToastContainer');
                if (!container) return;

                const iconMap = {
                    success: 'bi-check-circle-fill',
                    danger: 'bi-exclamation-circle-fill',
                    error: 'bi-exclamation-circle-fill',
                    warning: 'bi-exclamation-triangle-fill',
                    info: 'bi-info-circle-fill'
                };
                const icon = iconMap[type] || 'bi-info-circle-fill';
                const alertType = (type === 'error') ? 'danger' : type;

                const toast = document.createElement('div');
                toast.className = `custom-alert custom-alert-${alertType}`;
                toast.innerHTML = `
                    <div class="d-flex align-items-center">
                        <i class="bi ${icon} alert-icon"></i>
                        <span class="alert-content">${message}</span>
                    </div>
                    <button type="button" class="btn-close-alert" aria-label="Fechar">
                        <i class="bi bi-x-lg"></i>
                    </button>
                `;

                const closeBtn = toast.querySelector('.btn-close-alert');
                closeBtn.addEventListener('click', () => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    setTimeout(() => toast.remove(), 250);
                });

                container.appendChild(toast);

                if (duration > 0) {
                    setTimeout(() => {
                        if (toast.parentElement) {
                            toast.style.opacity = '0';
                            toast.style.transform = 'translateY(-10px)';
                            setTimeout(() => toast.remove(), 250);
                        }
                    }, duration);
                }
            };

            // 4. Redefine window.alert nativo para o Toast customizado
            window.alert = function(msg) {
                window.showToast('warning', msg, 5000);
            };

            // 5. Sistema Global de Modal de Confirmação Customizado
            window.confirmAction = function(event, element, message, type = 'danger', title = 'Confirmar Ação', btnText = 'Sim, Confirmar') {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                // Fecha imediatamente qualquer menu dropdown aberto
                document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
                    menu.classList.remove('show');
                });
                document.querySelectorAll('[data-bs-toggle="dropdown"].show, [aria-expanded="true"]').forEach(btn => {
                    btn.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                    if (typeof bootstrap !== 'undefined' && bootstrap.Dropdown) {
                        const bsDropdown = bootstrap.Dropdown.getInstance(btn);
                        if (bsDropdown) bsDropdown.hide();
                    }
                });

                const modalEl = document.getElementById('globalConfirmModal');
                if (modalEl && modalEl.parentElement !== document.body) {
                    document.body.appendChild(modalEl);
                }
                if (!modalEl || typeof bootstrap === 'undefined') {
                    if (window.confirm(message)) {
                        if (element.tagName === 'A') window.location.href = element.href;
                        else if (element.form) element.form.submit();
                    }
                    return false;
                }

                const titleEl = document.getElementById('confirmModalTitle');
                const msgEl = document.getElementById('confirmModalMessage');
                const iconWrapper = document.getElementById('confirmModalIconWrapper');
                const iconEl = document.getElementById('confirmModalIcon');
                const btnConfirm = document.getElementById('confirmModalBtnConfirm');

                titleEl.textContent = title;
                msgEl.textContent = message;
                btnConfirm.textContent = btnText;

                if (type === 'danger') {
                    iconWrapper.style.background = '#fee2e2';
                    iconWrapper.style.color = '#dc2626';
                    iconEl.className = 'bi bi-trash3';
                    btnConfirm.className = 'btn btn-danger rounded-pill px-3 py-2 fw-semibold flex-fill shadow-sm';
                } else if (type === 'primary') {
                    iconWrapper.style.background = '#eff6ff';
                    iconWrapper.style.color = '#2563eb';
                    iconEl.className = 'bi bi-arrow-repeat';
                    btnConfirm.className = 'btn btn-primary rounded-pill px-3 py-2 fw-semibold flex-fill shadow-sm';
                } else if (type === 'success') {
                    iconWrapper.style.background = '#ecfdf5';
                    iconWrapper.style.color = '#059669';
                    iconEl.className = 'bi bi-check2-circle';
                    btnConfirm.className = 'btn btn-success rounded-pill px-3 py-2 fw-semibold flex-fill shadow-sm';
                }

                const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);

                btnConfirm.onclick = function() {
                    bsModal.hide();
                    if (element.tagName === 'A' && element.href) {
                        window.location.href = element.href;
                    } else if (element.form) {
                        element.form.submit();
                    } else if (typeof element.onclickAction === 'function') {
                        element.onclickAction();
                    }
                };

                bsModal.show();
                return false;
            };

            // 6. Inicialização e auto-dismiss suave para alertas de página existentes
            window.addEventListener('DOMContentLoaded', function() {
                const isCollapsed = sidebar.classList.contains('collapsed');
                setupTooltips(isCollapsed);

                // Auto-dismiss em alertas estáticos de sucesso
                const successAlerts = document.querySelectorAll('.alert-success, .custom-alert-success');
                successAlerts.forEach(alert => {
                    setTimeout(() => {
                        alert.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                        alert.style.opacity = '0';
                        alert.style.transform = 'translateY(-6px)';
                        setTimeout(() => alert.remove(), 500);
                    }, 4500);
                });

                // Inicializa selects customizados
                if (window.initCustomSelects) window.initCustomSelects();
            });

            // 7. Gerenciador Global de Modais Sobrepostos (Efeito de Profundidade / Foco Limpo)
            document.addEventListener('show.bs.modal', function(event) {
                const targetModal = event.target;
                const openModals = Array.from(document.querySelectorAll('.modal.show')).filter(m => m !== targetModal);

                if (openModals.length > 0) {
                    openModals.forEach(m => m.classList.add('modal-behind'));

                    const baseZIndex = 1060 + (openModals.length * 20);
                    targetModal.style.zIndex = baseZIndex;

                    setTimeout(() => {
                        const backdrops = document.querySelectorAll('.modal-backdrop');
                        if (backdrops.length > 1) {
                            const lastBackdrop = backdrops[backdrops.length - 1];
                            lastBackdrop.style.zIndex = baseZIndex - 5;
                            lastBackdrop.classList.add('nested-backdrop');
                        }
                    }, 10);
                }

                if (window.initCustomSelects) window.initCustomSelects(targetModal);
            });

            document.addEventListener('hidden.bs.modal', function(event) {
                const targetModal = event.target;
                targetModal.classList.remove('modal-behind');
                targetModal.style.zIndex = '';

                const remainingModals = Array.from(document.querySelectorAll('.modal.show')).filter(m => m !== targetModal);
                if (remainingModals.length > 0) {
                    const topRemaining = remainingModals[remainingModals.length - 1];
                    topRemaining.classList.remove('modal-behind');
                    // Garante que o body continue travado para scroll enquanto houver modais abertos
                    document.body.classList.add('modal-open');
                }
            });

            // 8. Custom Dropdown Select Component (Substitui o popup nativo retangular do navegador)
            window.initCustomSelects = function(scope = document) {
                scope.querySelectorAll('select.form-select, select.form-select-minimal').forEach(selectEl => {
                    if (selectEl.dataset.customized === 'true') {
                        if (selectEl._syncCustomSelect) selectEl._syncCustomSelect();
                        return;
                    }
                    selectEl.dataset.customized = 'true';
                    selectEl.style.display = 'none';

                    const container = document.createElement('div');
                    container.className = 'custom-select-container';

                    const trigger = document.createElement('button');
                    trigger.type = 'button';
                    trigger.className = 'custom-select-trigger';

                    const label = document.createElement('span');
                    label.className = 'custom-select-label';

                    const chevron = document.createElement('i');
                    chevron.className = 'bi bi-chevron-down chevron-icon';

                    trigger.appendChild(label);
                    trigger.appendChild(chevron);
                    container.appendChild(trigger);

                    const dropdown = document.createElement('div');
                    dropdown.className = 'custom-select-dropdown';
                    container.appendChild(dropdown);

                    selectEl.parentNode.insertBefore(container, selectEl.nextSibling);

                    function updateOptions() {
                        dropdown.innerHTML = '';
                        let hasSelected = false;
                        Array.from(selectEl.options).forEach(opt => {
                            const optDiv = document.createElement('div');
                            optDiv.className = 'custom-select-option';
                            optDiv.textContent = opt.textContent;
                            optDiv.dataset.value = opt.value;
                            if (!opt.value) optDiv.classList.add('is-placeholder');

                            if (opt.selected || selectEl.value === opt.value) {
                                optDiv.classList.add('selected');
                                label.textContent = opt.textContent;
                                if (!opt.value) label.classList.add('placeholder-text');
                                else label.classList.remove('placeholder-text');
                                hasSelected = true;
                            }

                            optDiv.addEventListener('click', () => {
                                selectEl.value = opt.value;
                                selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                                updateSelectionUI(opt.value);
                                container.classList.remove('open');
                            });

                            dropdown.appendChild(optDiv);
                        });

                        if (!hasSelected && selectEl.options.length > 0) {
                            label.textContent = selectEl.options[0].textContent;
                            if (!selectEl.options[0].value) label.classList.add('placeholder-text');
                            else label.classList.remove('placeholder-text');
                        }
                    }

                    function updateSelectionUI(value) {
                        dropdown.querySelectorAll('.custom-select-option').forEach(optDiv => {
                            if (optDiv.dataset.value === String(value)) {
                                optDiv.classList.add('selected');
                                label.textContent = optDiv.textContent;
                                if (!value) label.classList.add('placeholder-text');
                                else label.classList.remove('placeholder-text');
                            } else {
                                optDiv.classList.remove('selected');
                            }
                        });
                    }

                    trigger.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        document.querySelectorAll('.custom-select-container.open').forEach(c => {
                            if (c !== container) c.classList.remove('open');
                        });
                        container.classList.toggle('open');
                    });

                    selectEl.addEventListener('change', () => {
                        updateSelectionUI(selectEl.value);
                    });

                    const observer = new MutationObserver(() => {
                        updateOptions();
                    });
                    observer.observe(selectEl, { childList: true, subtree: true });

                    selectEl._syncCustomSelect = function() {
                        updateOptions();
                        updateSelectionUI(selectEl.value);
                    };

                    updateOptions();
                });
            };

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-select-container')) {
                    document.querySelectorAll('.custom-select-container.open').forEach(c => c.classList.remove('open'));
                }
            });
        })();
    </script>
</th:block>
</body>
</html>
