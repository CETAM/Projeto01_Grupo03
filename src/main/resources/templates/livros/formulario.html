<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${livro.id != null ? 'Editar Livro' : 'Novo Livro'} + ' - Sistema de Biblioteca'"></title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Sidebar & Design System CSS -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .content-card-minimal {
            max-width: 560px;
        }
    </style>
</head>

<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('livros')}"></div>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <!-- Header da Página -->
        <div class="mb-3">
            <a th:href="@{/livros}" class="text-decoration-none text-muted d-inline-flex align-items-center mb-2 small fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Voltar para acervo de livros
            </a>
            <h2 class="page-title" th:text="${livro.id != null ? 'Editar Livro' : 'Novo Livro'}">Novo Livro</h2>
            <p class="page-subtitle">Preencha as informações da obra no acervo</p>
        </div>

        <!-- Alerta de Erro Customizável -->
        <div th:if="${mensagemErro}" class="custom-alert custom-alert-danger mb-3" role="alert">
            <div class="d-flex align-items-center">
                <i class="bi bi-exclamation-circle-fill alert-icon"></i>
                <span class="alert-content" th:text="${mensagemErro}"></span>
            </div>
            <button type="button" class="btn-close-alert" onclick="this.parentElement.remove()" aria-label="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- Formulário -->
        <div class="content-card-minimal">
            <form th:action="@{/livros/salvar}" th:object="${livro}" method="post">
                <!-- ID Oculto para edição -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título da Obra <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           id="titulo"
                           th:field="*{titulo}"
                           class="form-control form-control-minimal"
                           placeholder="Ex: Dom Casmurro, Memórias Póstumas..."
                           maxlength="200"
                           required
                           autofocus>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <label for="isbn" class="form-label">
                            ISBN
                        </label>
                        <input type="text"
                               id="isbn"
                               th:field="*{isbn}"
                               class="form-control form-control-minimal"
                               placeholder="Ex: 978-85..."
                               maxlength="50">
                    </div>
                    <div class="col-md-4">
                        <label for="ano" class="form-label">
                            Ano Publicação
                        </label>
                        <input type="number"
                               id="ano"
                               th:field="*{ano}"
                               class="form-control form-control-minimal"
                               placeholder="Ex: 2024" min="1500" max="2100">
                    </div>
                    <div class="col-md-4">
                        <label for="quantidadeExemplares" class="form-label">
                            Exemplares <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               id="quantidadeExemplares"
                               th:field="*{quantidadeExemplares}"
                               class="form-control form-control-minimal"
                               placeholder="Ex: 5" min="0" max="9999" required>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label for="autor" class="form-label">
                            Autor <span class="text-danger">*</span>
                        </label>
                        <select id="autor" th:field="*{autor}" class="form-select form-select-minimal" required>
                            <option value="">Selecione um autor...</option>
                            <option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.nome}">Machado de Assis</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="editora" class="form-label">
                            Editora <span class="text-danger">*</span>
                        </label>
                        <select id="editora" th:field="*{editora}" class="form-select form-select-minimal" required>
                            <option value="">Selecione uma editora...</option>
                            <option th:each="e : ${editoras}" th:value="${e.id}" th:text="${e.nome}">Companhia das Letras</option>
                        </select>
                    </div>
                </div>

                <!-- Campo Categoria -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="categoria" class="form-label mb-0">
                            Categoria
                        </label>
                        <button type="button" class="btn btn-sm btn-link text-primary text-decoration-none p-0 fw-semibold" style="font-size: 0.78rem;" onclick="abrirModalNovaCategoria()">
                            <i class="bi bi-plus-circle me-1"></i> Nova Categoria
                        </button>
                    </div>
                    <select id="categoria" th:field="*{categoria}" class="form-select form-select-minimal">
                        <option value="">Selecione uma categoria...</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}">Ficção Científica</option>
                    </select>
                </div>

                <!-- Switch de Disponibilidade -->
                <div class="form-check form-switch mb-3 p-0 d-flex align-items-center justify-content-between rounded-3 p-2 px-3 border" style="background: var(--bg-subtle);">
                    <label class="form-check-label fw-semibold mb-0 small" for="disponivel" style="color: var(--text-primary);">
                        <i class="bi bi-check-circle text-success me-1"></i> Livro Disponível para Empréstimo
                    </label>
                    <input class="form-check-input m-0" type="checkbox" role="switch" id="disponivel" th:field="*{disponivel}">
                </div>

                <div class="d-flex gap-2 justify-content-end pt-1">
                    <a th:href="@{/livros}" class="btn btn-light btn-sm fw-semibold text-secondary px-3">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-sm px-3">
                        <i class="bi bi-check2 me-1"></i> Salvar Livro
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- MINI-MODAL DE CADASTRO RÁPIDO DE CATEGORIA -->
<div class="modal fade" id="modalNovaCategoria" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" style="max-width: 380px;">
        <div class="modal-content p-4 border-0 shadow-lg" style="border-radius: 16px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-tag text-primary me-1"></i> Nova Categoria
                </h6>
                <button type="button" class="btn-close-custom" onclick="fecharModalNovaCategoria()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="formNovaCategoria" onsubmit="salvarNovaCategoria(event)">
                <div class="mb-3">
                    <label for="catNome" class="form-label fw-semibold small text-secondary">Nome da Categoria <span class="text-danger">*</span></label>
                    <input type="text" id="catNome" class="form-control form-control-minimal" placeholder="Ex: Ficção Científica, Romance..." required maxlength="100" autocomplete="off">
                </div>
                <div class="mb-3">
                    <label for="catDescricao" class="form-label fw-semibold small text-secondary">Descrição (opcional)</label>
                    <input type="text" id="catDescricao" class="form-control form-control-minimal" placeholder="Breve resumo sobre a categoria..." maxlength="255">
                </div>
                <div class="d-flex justify-content-end gap-2 pt-2">
                    <button type="button" class="btn btn-light rounded-pill px-3 py-1 btn-sm fw-semibold text-muted" onclick="fecharModalNovaCategoria()">Cancelar</button>
                    <button type="submit" id="btnSalvarNovaCat" class="btn btn-primary rounded-pill px-3 py-1 btn-sm fw-semibold shadow-sm">
                        <i class="bi bi-check2 me-1"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function abrirModalNovaCategoria() {
        document.getElementById('formNovaCategoria').reset();
        const modalEl = document.getElementById('modalNovaCategoria');
        const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
        bsModal.show();
    }

    function fecharModalNovaCategoria() {
        const modalEl = document.getElementById('modalNovaCategoria');
        const bsModal = bootstrap.Modal.getInstance(modalEl);
        if (bsModal) bsModal.hide();
    }

    async function salvarNovaCategoria(event) {
        event.preventDefault();
        const nome = document.getElementById('catNome').value.trim();
        const descricao = document.getElementById('catDescricao').value.trim();

        if (!nome) {
            if (window.showToast) window.showToast('danger', 'O nome da categoria é obrigatório.');
            return;
        }

        const btn = document.getElementById('btnSalvarNovaCat');
        btn.disabled = true;

        try {
            const response = await fetch('/api/categorias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, descricao })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.mensagem || 'Erro ao criar categoria.');
            }

            const novaCategoria = await response.json();

            const selectCategoria = document.getElementById('categoria');
            const opt = document.createElement('option');
            opt.value = novaCategoria.id;
            opt.textContent = novaCategoria.nome;
            opt.selected = true;
            selectCategoria.appendChild(opt);

            fecharModalNovaCategoria();
            if (window.showToast) {
                window.showToast('success', `Categoria "${novaCategoria.nome}" criada com sucesso!`);
            }
        } catch (error) {
            if (window.showToast) {
                window.showToast('danger', error.message);
            }
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>

</html>
