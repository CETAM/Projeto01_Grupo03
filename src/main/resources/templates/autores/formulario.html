<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${autor.id != null ? 'Editar Autor' : 'Novo Autor'} + ' - Sistema de Biblioteca'"></title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Sidebar & Design System CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <style>
    .content-card-minimal {
      max-width: 520px;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Fragment -->
  <div th:replace="~{fragments/sidebar :: sidebar('autores')}"></div>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <!-- Header da Página -->
    <div class="mb-3">
      <a th:href="@{/autores}" class="text-decoration-none text-muted d-inline-flex align-items-center mb-2 small fw-medium">
        <i class="bi bi-arrow-left me-1"></i> Voltar para lista de autores
      </a>
      <h2 class="page-title" th:text="${autor.id != null ? 'Editar Autor' : 'Novo Autor'}">Novo Autor</h2>
      <p class="page-subtitle">Preencha as informações do autor abaixo</p>
    </div>

    <!-- Alerta de Erro Customizável -->
    <div th:if="${mensagemErro}" class="custom-alert custom-alert-danger mb-3" role="alert">
      <div class="d-flex align-items-center">
        <i class="bi bi-exclamation-circle-fill alert-icon"></i>
        <span class="alert-content" th:text="${mensagemErro}"></span>
      </div>
      <button type="button" class="btn-close-alert" onclick="this.parentElement.remove()" aria-label="Fechar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Formulário -->
    <div class="content-card-minimal">
      <form th:action="@{/autores/salvar}" th:object="${autor}" method="post">
        <!-- ID Oculto para edição -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Autor <span class="text-danger">*</span></label>
          <input type="text"
                 id="nome"
                 th:field="*{nome}"
                 class="form-control form-control-minimal"
                 placeholder="Ex: Clarice Lispector, Machado de Assis"
                 maxlength="200"
                 required
                 autofocus>
        </div>

        <div class="d-flex gap-2 justify-content-end pt-1">
          <a th:href="@{/autores}" class="btn btn-light btn-sm fw-semibold text-secondary px-3">
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary btn-sm px-3">
            <i class="bi bi-check2 me-1"></i> Salvar Autor
          </button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
